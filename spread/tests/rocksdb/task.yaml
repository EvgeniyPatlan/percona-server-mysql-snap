summary: Percona Server RocksDB (MyRocks) engine tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-server-mysql/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Enabling RocksDB via ps-admin"
  CMD="percona-server-mysql.mysql -u root"

  percona-server-mysql.ps-admin --enable-rocksdb -u root

  echo "Checking engine registration"
  ${CMD} -e "SHOW ENGINES;" | grep -i rocksdb

  echo "Creating a RocksDB table"
  ${CMD} -e "CREATE DATABASE rdb;"
  ${CMD} -e "CREATE TABLE rdb.t (id INT PRIMARY KEY, v VARCHAR(50)) ENGINE=ROCKSDB;"
  ${CMD} -e "INSERT INTO rdb.t VALUES (1, 'hello_rocksdb');"
  ${CMD} -e "SELECT v FROM rdb.t WHERE id = 1;" | grep hello_rocksdb

  echo "Restarting service; plugin must persist"
  snap restart percona-server-mysql.mysqld
  until ${CMD} -e "SELECT 1;" &>/dev/null; do
    echo "Waiting for mysql to be available..."
    sleep 1
  done

  ${CMD} -e "SELECT v FROM rdb.t WHERE id = 1;" | grep hello_rocksdb
  ${CMD} -e "DROP DATABASE rdb;"

restore: |
  snap remove percona-server-mysql --purge --terminate
