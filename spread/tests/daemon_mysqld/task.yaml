summary: Percona Server mysqld service tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-server-mysql/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing service control"
  CMD="percona-server-mysql.mysql -u root"

  echo "Stopping percona-server-mysql.mysqld"
  snap stop percona-server-mysql.mysqld
  until [ ! -e /var/snap/percona-server-mysql/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock to be removed"
    sleep 1
  done

  ${CMD} -e "SELECT 1;" &>/dev/null || :
  snap services percona-server-mysql.mysqld | grep -q inactive

  echo "Starting percona-server-mysql.mysqld"
  snap start percona-server-mysql.mysqld
  until [ -S /var/snap/percona-server-mysql/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock to be created"
    sleep 1
  done

  ${CMD} -e "SELECT 1;" &>/dev/null
  snap services percona-server-mysql.mysqld | grep -q " active"

restore: |
  snap remove percona-server-mysql --purge --terminate
